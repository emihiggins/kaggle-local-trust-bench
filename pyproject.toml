[project]
name = "local-trust-bench"
version = "0.1.0"
description = "Can a local model trust the documents it reads? An evidence-grounding benchmark for Apple-silicon and Kaggle-hosted models."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA.md"]

dependencies = []

[project.optional-dependencies]
local = ["mlx-lm", "psutil"]
analysis = ["pandas", "numpy", "matplotlib"]
kaggle = ["kaggle-benchmarks", "pandas", "python-dotenv"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_trust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
